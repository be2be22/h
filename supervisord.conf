# =============================================================================
# supervisord.conf — Process manager for Nginx + 3x-ui (which runs Xray)
# =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

# ----- Nginx reverse proxy (port 80 — the only exposed port) ---------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/nginx.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# ----- 3x-ui panel (manages Xray core internally) --------------------------
# 3x-ui starts the web panel on port 2053 (internal) and launches Xray with
# the inbounds configured through its database. Xray listens on 127.0.0.1
# ports 10001 (VLESS-WS) and 10002 (Trojan-WS) — both behind Nginx.
[program:x-ui]
command=/usr/local/x-ui/x-ui
directory=/usr/local/x-ui
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
priority=20
stdout_logfile=/var/log/supervisor/x-ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/x-ui.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",LANG="en_US.UTF-8",LC_ALL="en_US.UTF-8"

# ----- Supervisor control interface (internal only) ------------------------
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
