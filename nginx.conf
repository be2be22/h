# =============================================================================
# nginx.conf — Reverse proxy with HTTP/WebSocket multiplexing on a single port
# =============================================================================
# Architecture:
#   :80 (Nginx, public)
#     ├── /                  →  127.0.0.1:2053  (3x-ui Farsi web panel)
#     ├── /vless-ws/         →  127.0.0.1:10001 (Xray VLESS-WebSocket)
#     ├── /trojan-ws/        →  127.0.0.1:10002 (Xray Trojan-WebSocket)
#     └── (fallback target)  →  127.0.0.1:8080  (fake HTML page)
#
# The 3x-ui panel HTML is patched via sub_filter to set Farsi (fa-IR) as the
# default UI language on first visit, stored in the browser's localStorage.
# =============================================================================

user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # WebSocket upgrade map (used by all proxy locations)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Internal-only server: serves a benign HTML page used as the Xray
    # fallback destination. When a non-WebSocket client probes /vless-ws/
    # or /trojan-ws/, Xray redirects them here so the endpoint looks like
    # an ordinary website rather than a proxy.
    # -------------------------------------------------------------------------
    server {
        listen 127.0.0.1:8080;
        server_name _;
        access_log off;
        error_log  /var/log/nginx/fallback-error.log warn;

        root /var/www/fake;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # -------------------------------------------------------------------------
    # MAIN PUBLIC SERVER (port 80 — the only exposed port)
    # Defang's HTTPS load balancer forwards decrypted HTTP traffic here.
    # -------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        client_max_body_size 50m;
        client_body_buffer_size 1m;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # ---------------------------------------------------------------------
        # Xray VLESS-WebSocket inbound
        # Path: /vless-ws/
        # Must be declared BEFORE the / catch-all so Nginx matches it first.
        # ---------------------------------------------------------------------
        location /vless-ws/ {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            # Long-lived WebSocket connections
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            proxy_connect_timeout 60s;

            # Disable buffering for real-time proxy traffic
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ---------------------------------------------------------------------
        # Xray Trojan-WebSocket inbound
        # Path: /trojan-ws/
        # ---------------------------------------------------------------------
        location /trojan-ws/ {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            proxy_connect_timeout 60s;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ---------------------------------------------------------------------
        # 3x-ui Farsi Web Management Panel (default route)
        # The panel serves its own static assets (/assets/*) and API
        # (/server/*, /login, /panel/*, etc.) — all are proxied here.
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:2053;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_connect_timeout 60s;

            # -----------------------------------------------------------------
            # Farsi (Persian) language auto-selection
            # 3x-ui stores the UI language in browser localStorage under the
            # key "lang". We inject a tiny script that sets it to "fa-IR" on
            # the first visit only (the check prevents overriding the user's
            # manual choice later).
            #
            # `Accept-Encoding: ""` forces the upstream to send uncompressed
            # HTML so that sub_filter can patch it.
            # -----------------------------------------------------------------
            proxy_set_header Accept-Encoding "";

            sub_filter '</head>' '<script>if(!localStorage.getItem("lang")){localStorage.setItem("lang","fa-IR");setTimeout(function(){window.location.reload();},50);}</script></head>';
            sub_filter_once     on;
            sub_filter_types    text/html;
            sub_filter_last_modified on;
        }

        # ---------------------------------------------------------------------
        # Static asset optimization (panel CSS/JS/images)
        # ---------------------------------------------------------------------
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://127.0.0.1:2053;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # ---------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
